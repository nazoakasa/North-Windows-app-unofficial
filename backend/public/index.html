<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>north 利用者数ダッシュボード</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main id="login" class="login" hidden>
  <form id="loginForm" class="panel" autocomplete="off">
    <h1>north 利用者数</h1>
    <p class="muted">管理用トークンを入力してください。</p>
    <input id="token" type="password" placeholder="管理用トークン" autocomplete="current-password" required>
    <button class="btn primary" type="submit">ログイン</button>
    <p id="loginErr" class="err" role="alert"></p>
  </form>
</main>

<main id="dash" class="wrap" hidden>
  <header class="top">
    <div>
      <h1>north 利用者数</h1>
      <p class="muted" id="updated">&nbsp;</p>
    </div>
    <div class="actions">
      <button class="btn" id="refresh" type="button">更新</button>
      <button class="btn" id="logout" type="button">ログアウト</button>
    </div>
  </header>

  <section id="kpis" class="kpis" aria-label="概要"></section>

  <section class="panel">
    <div class="panel-head">
      <h2>アクティブユーザー(日次)</h2>
      <div class="seg" id="range" role="group" aria-label="表示期間">
        <button type="button" data-days="30" class="on">30日</button>
        <button type="button" data-days="90">90日</button>
        <button type="button" data-days="180">180日</button>
        <button type="button" data-days="365">1年</button>
      </div>
    </div>
    <div class="chart" id="chartDau"></div>
  </section>

  <div class="two">
    <section class="panel">
      <h2>新規ユーザー(日次)</h2>
      <div class="chart" id="chartNew"></div>
    </section>
    <section class="panel">
      <h2>累計ユーザー数</h2>
      <div class="chart" id="chartTotal"></div>
    </section>
  </div>

  <section class="panel">
    <h2>バージョン別ユーザー数</h2>
    <div id="versions" class="bars"></div>
  </section>

  <p class="muted note">日付は UTC。サーバーには一方向ハッシュ化したIDだけを保持し、元のユーザーID・端末ID・IPアドレスは保存していません。DAU/WAU/MAU はユーザー単位の重複排除です。</p>
</main>
<script src="/app.js" defer></script>
</body>
</html>
